# nginx.conf — Cấu hình tối ưu Reverse Proxy cho CodeLens Express API & SSE Streaming
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Gzip nén dữ liệu phản hồi JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Rate limiting chống spam webhook hoặc DDOS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # Endpoint kiểm tra sức khỏe
        location /health {
            proxy_pass http://server:4000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Định tuyến API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://server:4000/api/;
            proxy_http_version 1.1;

            # Quan trọng cho Server-Sent Events (SSE) Streaming Token Gemini
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng timeout cho quá trình Ingest AST và RAG Streaming
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
    }
}

